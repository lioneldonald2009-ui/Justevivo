name: Build JUSTEVIVO native apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "capacitor.config.ts"
      - "scripts/**"
      - "index.html"
      - "*.css"
      - "*.js"
      - "icons/**"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  android-debug:
    name: Android installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle and Android project
        run: |
          npm run build:web
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JUSTEVIVO-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build (unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web bundle and iOS project
        run: |
          npm run build:web
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package simulator app
        run: |
          cd build/ios/Build/Products
          ditto -c -k --sequesterRsrc --keepParent Debug-iphonesimulator/App.app JUSTEVIVO-iOS-Simulator.zip

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: JUSTEVIVO-iOS-Simulator-unsigned
          path: build/ios/Build/Products/JUSTEVIVO-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
