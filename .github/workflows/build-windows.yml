name: Build JUSTEVIVO Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "desktop-main.cjs"
      - "desktop-preload.cjs"
      - "scripts/**"
      - "index.html"
      - "*.css"
      - "*.js"
      - "icons/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer and portable app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build:web
      - name: Package Windows applications
        run: npx electron-builder --win nsis portable
      - name: Upload Windows installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: JUSTEVIVO-Windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
