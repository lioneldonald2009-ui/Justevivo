name: Validate JUSTEVIVO frontend

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate syntax and core editor features
        run: npm test
      - name: Prepare web build
        run: npm run build:web && test ! -f www/package.json
